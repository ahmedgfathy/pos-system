services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - backend-data:/app/data
    environment:
      - PORT=3001
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:8080

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:3001

volumes:
  backend-data:
