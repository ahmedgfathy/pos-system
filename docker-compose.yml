services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - backend-data:/app/data
    environment:
      - PORT=3001
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:8080

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  expo:
    image: node:18-alpine
    working_dir: /app
    command: npx expo start --lan --port 8081
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=192.168.1.9
      - EXPO_PUBLIC_API_URL=http://192.168.1.9:3001
    depends_on:
      - backend

volumes:
  backend-data:
